name: CI

on:
  push:
    branches: [ main, master, 'codex/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          # llvm is required but is absent from the SDK's documented dependency
          # list: without llvm-config the wrapper fails with a confusing
          # "/llvm-clang: No such file or directory".
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm make unzip curl python3 nodejs

      - name: Web GUI checks
        run: make check

      - name: Install PS5 Payload SDK
        run: |
          curl -sSL -o sdk.zip \
            https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          sudo unzip -q -o -d /opt sdk.zip
          sudo chmod -R +x /opt/ps5-payload-sdk/bin

      # Built with -Wall -Wextra -Werror, so a warning fails the build.
      - name: Build native tile payloads
        run: |
          export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          make clean all
          file audiobridge-gui.elf
          file audiobridge-uninstall.elf

      - name: Verify native tile and test bundle
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path('tile/sce_sys/param.json').read_text())
          assert metadata['titleId'] == 'ABRG18195'
          assert metadata['deeplinkUri'] == 'http://127.0.0.1:18195/'
          assert metadata['applicationCategoryType'] == 65536
          PY
          export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          make package-test
          unzip -t "build/AudioBridge-GUI-v$(cat VERSION)-test.zip"

      # Temporary rollback coverage. Remove only after native-tile hardware
      # install/update/reboot/uninstall verification succeeds.
      - name: Verify legacy websrv package layout
        run: |
          mkdir -p package/AudioBridge-GUI/sce_sys
          cp audiobridge-gui.elf package/AudioBridge-GUI/eboot.elf
          cp homebrew.js package/AudioBridge-GUI/homebrew.js
          cp sce_sys/icon0.png package/AudioBridge-GUI/sce_sys/icon0.png
          test -s package/AudioBridge-GUI/eboot.elf
          test -s package/AudioBridge-GUI/homebrew.js
