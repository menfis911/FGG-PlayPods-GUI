name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'New tag to publish, for example v0.2.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build and publish Web GUI package
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Check out requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}

      - name: Validate new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm make unzip curl zip python3 nodejs

      - name: Run Web GUI checks
        run: make check

      - name: Install PS5 Payload SDK
        run: |
          curl -sSL -o sdk.zip \
            https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          sudo unzip -q -o -d /opt sdk.zip
          sudo chmod -R +x /opt/ps5-payload-sdk/bin

      - name: Build native backend
        run: |
          export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          make
          file audiobridge-gui.elf

      - name: Build websrv Homebrew package
        run: |
          PACKAGE="AudioBridge-GUI-websrv-${RELEASE_TAG}.zip"
          mkdir -p package/AudioBridge-GUI/sce_sys
          cp audiobridge-gui.elf package/AudioBridge-GUI/eboot.elf
          cp homebrew.js package/AudioBridge-GUI/homebrew.js
          cp sce_sys/icon0.png package/AudioBridge-GUI/sce_sys/icon0.png
          (cd package && zip -qr "../$PACKAGE" AudioBridge-GUI)
          unzip -t "$PACKAGE"

          SHA=$(sha256sum audiobridge-gui.elf | cut -d' ' -f1)
          cat > audiobridge-gui.elf.json <<META
          {
            "name": "AudioBridge-GUI",
            "filename": "audiobridge-gui.elf",
            "description": "Web GUI and native Bluetooth/A2DP backend for PS5.",
            "version": "$RELEASE_TAG",
            "checksum": "$SHA",
            "category": "Audio",
            "source": "https://github.com/$GITHUB_REPOSITORY"
          }
          META
          sha256sum audiobridge-gui.elf "$PACKAGE" > SHA256SUMS

      - name: Publish immutable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: AudioBridge — GUI — ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            audiobridge-gui.elf
            audiobridge-gui.elf.json
            SHA256SUMS
            AudioBridge-GUI-websrv-*.zip
          body: |
            ## Web GUI release

            Install `AudioBridge-GUI` from the WebSrv ZIP into `/data/homebrew/`.
            The package contains the native Bluetooth/A2DP backend, the websrv tile
            extension, and the icon. The Web GUI is embedded into `eboot.elf`.
