name: Релиз

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Существующий тег для сборки и публикации, например v1.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Сборка и публикация payload
    runs-on: ubuntu-latest

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Установка инструментов
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld llvm make unzip curl

      - name: Установка PS5 Payload SDK
        run: |
          curl -sSL -o sdk.zip https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          sudo unzip -q -o -d /opt sdk.zip
          sudo chmod -R +x /opt/ps5-payload-sdk/bin

      - name: Сборка
        run: |
          export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          make
          file fgg-playpods-gui.elf

      - name: Создание metadata
        run: |
          VERSION="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          SHA=$(sha256sum fgg-playpods-gui.elf | cut -d' ' -f1)
          cat > fgg-playpods-gui.elf.json <<META
          {
            "name": "FGG-PlayPods-GUI",
            "filename": "fgg-playpods-gui.elf",
            "description": "Полноэкранный графический интерфейс PS5 для поиска и подключения Bluetooth-аудиоустройств.",
            "version": "${VERSION}",
            "checksum": "${SHA}",
            "category": "Audio",
            "source": "https://github.com/menfis911/FGG-PlayPods-GUI"
          }
          META
          sha256sum fgg-playpods-gui.elf | tee SHA256SUMS
          cat fgg-playpods-gui.elf.json

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'test') || github.ref_name }}
          name: FGG-PlayPods-GUI — ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: false
          files: |
            fgg-playpods-gui.elf
            fgg-playpods-gui.elf.json
            SHA256SUMS
          body: |
            ## FGG-PlayPods-GUI — тестовая сборка

            Обновлённая тестовая версия GUI-форка FGG-PlayPods.

            ### Изменения в этой версии
            - исправлена критическая ошибка запуска GUI через Payload Manager;
            - ошибка `sceSystemServiceHideSplashScreen` теперь не останавливает инициализацию VideoOut;
            - исправлен расчёт высоты tiled framebuffer для корректного вывода изображения;
            - убран отдельный пункт «Логи» из GUI;
            - обновлены имя проекта, ELF и metadata: `FGG-PlayPods-GUI`, `fgg-playpods-gui.elf`;
            - обновлены русские описание и metadata для Payload Manager;
            - сохранён SHA-256 для проверки целостности payload.

            ### Уже реализовано
            - полноэкранный графический интерфейс через PS5 VideoOut;
            - управление DualSense;
            - Bluetooth-сканирование и список найденных аудиоустройств;
            - выбор устройства и запуск подключения;
            - отдельная папка состояния: `/data/fgg-playpods-gui/`;
            - отдельное имя ELF и metadata для Payload Manager.

            ### Управление
            - **↑ / ↓** — выбор;
            - **✕** — открыть / подключить;
            - **○** — назад;
            - **□** — повторное сканирование;
            - **Options** — выход.

            ### В разработке
            - сохранение нескольких сопряжённых устройств;
            - повторное подключение;
            - настройки;
            - режимы Auto / 1080p / 1440p / 4K;
            - доработка Bluetooth state machine и аудиостриминга.

            > Это тестовая сборка: GUI и Bluetooth-логика ещё активно дорабатываются.

            ## Установка

            **Payload Manager** — скопируйте `fgg-playpods-gui.elf` и `fgg-playpods-gui.elf.json`
            по FTP в `/data/pldmgr/payloads/fgg-playpods-gui/`, затем запустите
            **FGG-PlayPods-GUI**.

            **Прямой запуск** — отправьте `fgg-playpods-gui.elf` на порт 9021 совместимым
            payload sender.

            ## Проверка

            После запуска сначала проверяем, появляется ли GUI на экране. Bluetooth и аудиостриминг
            тестируем следующим этапом.

            Проверить целостность файла можно по `SHA256SUMS`.
