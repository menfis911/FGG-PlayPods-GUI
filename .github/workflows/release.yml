name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'New tag to publish, for example v0.2.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build and publish native-tile payloads
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Check out requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}

      - name: Validate new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm make unzip curl zip python3 nodejs

      - name: Run Web GUI checks
        run: make check

      - name: Install PS5 Payload SDK
        run: |
          curl -sSL -o sdk.zip \
            https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          sudo unzip -q -o -d /opt sdk.zip
          sudo chmod -R +x /opt/ps5-payload-sdk/bin

      - name: Build native backend, tile installer and uninstaller
        run: |
          export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          make clean all
          file audiobridge-gui.elf
          file audiobridge-uninstall.elf

      - name: Build test bundle and temporary legacy websrv rollback
        run: |
          export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          make package-test
          TEST_PACKAGE="AudioBridge-GUI-${RELEASE_TAG}-test.zip"
          cp "build/AudioBridge-GUI-v$(cat VERSION)-test.zip" "$TEST_PACKAGE"

          PACKAGE="AudioBridge-GUI-legacy-websrv-${RELEASE_TAG}.zip"
          mkdir -p package/AudioBridge-GUI/sce_sys
          cp audiobridge-gui.elf package/AudioBridge-GUI/eboot.elf
          cp homebrew.js package/AudioBridge-GUI/homebrew.js
          cp sce_sys/icon0.png package/AudioBridge-GUI/sce_sys/icon0.png
          (cd package && zip -qr "../$PACKAGE" AudioBridge-GUI)
          unzip -t "$PACKAGE"

          SHA=$(sha256sum audiobridge-gui.elf | cut -d' ' -f1)
          cat > audiobridge-gui.elf.json <<META
          {
            "name": "AudioBridge-GUI",
            "filename": "audiobridge-gui.elf",
            "description": "PS5 Bluetooth audio device A2DP/SBC Web GUI with native ABRG18195 tile, based on FGG-PlayPods by FathiGhanem.",
            "version": "$RELEASE_TAG",
            "checksum": "$SHA",
            "category": "Audio",
            "titleId": "ABRG18195",
            "source": "https://github.com/$GITHUB_REPOSITORY"
          }
          META
          sha256sum audiobridge-gui.elf audiobridge-uninstall.elf \
            "$TEST_PACKAGE" "$PACKAGE" > SHA256SUMS

      - name: Publish immutable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: AudioBridge — GUI — ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            audiobridge-gui.elf
            audiobridge-gui.elf.json
            audiobridge-uninstall.elf
            SHA256SUMS
            AudioBridge-GUI-v*-test.zip
            AudioBridge-GUI-legacy-websrv-*.zip
          body: |
            ## Native tile test release

            Send `audiobridge-gui.elf` to elfldr (normally port 9021). It runs the
            Bluetooth/A2DP backend and HTTP server on port 18195, and installs or
            updates the owned `ABRG18195` Media tile pointing to localhost:18195.

            `audiobridge-uninstall.elf` safely removes only the owned tile and keeps
            pairing data. See `INSTALL-RU.txt` in the test bundle for the hardware
            test procedure. The legacy websrv ZIP is a temporary rollback asset and
            is not the target architecture; remove it only after native-tile PS5
            verification succeeds.
